<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語トレカコレクション（超軽量高速版）</title>
    <!-- カメラと紙吹雪の外部ライブラリを読み込み -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; margin-bottom: 5px; }
        .counter { font-size: 16px; color: #666; margin-bottom: 20px; font-weight: bold; }
        
        /* スキャンボタン */
        .scan-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .scan-btn:hover { background: #218838; }

        /* コレクション全体のグリッド */
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }
        .card-container {
            background: white;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-container:active { transform: scale(0.95); }
        
        /* 解禁済みカードの画像スタイル */
        .card-img { width: 100%; height: auto; border-radius: 8px; display: block; }
        
        /* 🆕 未解禁カード用の軽量ダミー枠（画像の代わりにCSSで表現して通信量をゼロに） */
        .locked-placeholder {
            width: 100%;
            aspect-ratio: 2 / 3; /* カードの一般的な縦横比をキープ */
            background: #cbd5e1;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 32px;
            font-weight: bold;
        }
        
        .card-info { margin-top: 8px; font-size: 14px; font-weight: bold; color: #333; }
        /* 未解禁時はテキストを非表示にする */
        .locked .card-info { visibility: hidden; }

        /* カメラ画面のポップアップ */
        #camera-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #reader { width: 300px; background: white; border-radius: 8px; overflow: hidden; }
        .close-btn { margin-top: 15px; padding: 8px 16px; background: white; border: none; border-radius: 4px; cursor: pointer; }

        /* カード拡大表示のオーバーレイ */
        #zoom-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 30;
            justify-content: center;
            align-items: center;
        }
        .zoom-box {
            background: white;
            padding: 15px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: zoomIn 0.25s ease-out;
        }
        .zoom-box img { width: 100%; height: auto; border-radius: 12px; }
        .zoom-info { margin-top: 15px; font-size: 20px; font-weight: bold; color: #333; }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* クイズ画面のポップアップ */
        #quiz-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 15;
            justify-content: center;
            align-items: center;
        }
        .quiz-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .quiz-meaning { font-size: 24px; font-weight: bold; color: #e44d26; margin: 15px 0; }
        
        .quiz-input {
            width: 90%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        .quiz-input:focus { border-color: #007bff; }
        
        .submit-btn {
            width: 96%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .submit-btn:hover { background: #0056b3; }
        .quiz-cancel-btn {
            margin-top: 10px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            text-decoration: underline;
        }

        /* ゲットアニメーション画面 */
        #get-animation-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        
        .flip-card {
            width: 260px;
            height: 480px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .flip-card.do-flip { transform: rotateY(180deg); }
        
        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex; flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: white; 
            box-shadow: 0 10px 25px rgba(255,255,255,0.2);
            box-sizing: border-box; 
        }
        
        .card-back {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            font-size: 48px;
            font-weight: bold;
            border: 5px solid white;
            justify-content: center; 
        }
        
        .card-front {
            transform: rotateY(180deg);
            padding: 15px;
        }
        
        .card-front img { 
            width: 100%; 
            max-height: 70%; 
            object-fit: contain;
            border-radius: 8px; 
            display: block; 
        }
    </style>
</head>
<body>

    <h1>英語トレカ図鑑</h1>
    <div class="counter" id="collectionCounter">0 / 40</div>
    
    <!-- QRコードスキャンボタン -->
    <button class="scan-btn" onclick="openCamera()">QRコードをスキャン</button>

    <!-- カメラ画面のポップアップ -->
    <div id="camera-modal">
        <div id="reader"></div>
        <button class="close-btn" onclick="closeCamera()">閉じる</button>
    </div>

    <!-- 記述式英語クイズ画面 -->
    <div id="quiz-overlay">
        <div class="quiz-box">
            <h3 style="margin:0; color:#666;">ミッション：英語で書きなさい</h3>
            <div class="quiz-meaning" id="quizMeaning">こんにちは</div>
            
            <input type="text" id="answerInput" class="quiz-input" placeholder="英語を入力してね" autocomplete="off" autofocus>
            
            <button class="submit-btn" onclick="checkAnswer()">解答する</button>
            <br>
            <button class="quiz-cancel-btn" onclick="closeQuiz()">あきらめる</button>
        </div>
    </div>

    <!-- カードゲットアニメーション画面 -->
    <div id="get-animation-overlay" onclick="closeAnimation()">
        <div class="flip-card" id="flipCard">
            <div class="card-face card-back">？</div>
            <div class="card-face card-front" id="animatedFront"></div>
        </div>
    </div>

    <!-- カード拡大表示画面 -->
    <div id="zoom-overlay" onclick="closeZoom()">
        <div class="zoom-box" onclick="event.stopPropagation()">
            <div id="zoomContent"></div>
        </div>
    </div>

    <!-- 図鑑表示エリア -->
    <div class="collection-grid" id="collectionGrid"></div>

    <script>
        const TOTAL_CARDS = 40; 

        // 記述式用のクイズデータ
        const quizList = {
            1: { meaning: "二重線", answer: "a double line" },
            2: { meaning: "まったく違う", answer: "a far cry from" },
            3: { meaning: "職業、身分", answer: "a walk of life" },
            4: { meaning: "放棄する、捨てる", answer: "abandon" },
            5: { meaning: "異常、異変", answer: "abnormality" }
            6: { meaning: "廃止する", answer: "abolish" },
            7: { meaning: "絶対的な", answer: "absolute" },
            8: { meaning: "吸収する", answer: "absorb" },
            9: { meaning: "豊富な", answer: "abundant" },
            10: { meaning: "利用できる", answer: "accessible" }
            11: { meaning: "達成、業績", answer: "accomplishment" },
            12: { meaning: "説明する", answer: "account for" },
            13: { meaning: "達成する", answer: "achieve" },
            14: { meaning: "功績、業績", answer: "achievement" },
            15: { meaning: "酸", answer: "acid" }
            16: { meaning: "習得する、獲得する", answer: "acquire" },
            17: { meaning: "適応する", answer: "adapt" },
            18: { meaning: "翻案、適応", answer: "adaptation" },
        };

        // 1. カードデータを自動生成
        const cardsData = [];
        for (let i = 1; i <= TOTAL_CARDS; i++) {
            const quiz = quizList[i] || { 
                meaning: `日本語の意味 ${i}`, 
                answer: `English ${i}` 
            };

            cardsData.push({
                id: `card-${i}`,
                img: `${i}.png`,
                no: i,
                quiz: quiz
            });
        }

        // 2. 解禁状態の管理
        let unlockedCards = JSON.parse(localStorage.getItem('unlockedCards')) || [];
        let html5QrcodeScanner = null;
        let currentScanningCard = null;

        // 3. 図鑑とカウンターの描画
        function renderCollection() {
            document.getElementById('collectionCounter').innerText = `${unlockedCards.length} / ${TOTAL_CARDS}`;
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = '';
            
            cardsData.forEach(card => {
                const isUnlocked = unlockedCards.includes(card.id);
                const cardEl = document.createElement('div');
                cardEl.className = `card-container ${isUnlocked ? '' : 'locked'}`;
                
                cardEl.onclick = () => tapCard(card, isUnlocked);
                
                // 🆕 【超重要】持っている時だけ <img> タグを生成し、本物画像をダウンロードさせる
                // 持っていない時は画像タグ自体を作らず、CSSのグレー枠（？）にするので、無駄な通信がゼロになります
                let cardVisualHTML = '';
                if (isUnlocked) {
                    cardVisualHTML = `<img src="${card.img}" alt="No.${card.no}" class="card-img" loading="lazy">`;
                } else {
                    cardVisualHTML = `<div class="locked-placeholder">？</div>`;
                }
                
                cardEl.innerHTML = `
                    ${cardVisualHTML}
                    <div class="card-info">
                        <div>${card.quiz.answer}</div>
                        <div style="font-size:12px; color:#666; margin-top:4px;">No.${card.no}</div>
                    </div>
                `;
                grid.appendChild(cardEl);
            });
        }

        // カードをタップしたときの拡大処理
        function tapCard(card, isUnlocked) {
            if (!isUnlocked) return;

            const zoomContent = document.getElementById('zoomContent');
            zoomContent.innerHTML = `
                <img src="${card.img}" alt="No.${card.no}">
                <div class="zoom-info">
                    <div>${card.quiz.answer}</div>
                    <div style="font-size:14px; color:#666; margin-top:6px;">No.${card.no}</div>
                    <div style="font-size:16px; color:#28a745; margin-top:4px; font-weight:normal;">意味: ${card.quiz.meaning}</div>
                </div>
            `;
            document.getElementById('zoom-overlay').style.display = 'flex';
        }

        function closeZoom() {
            document.getElementById('zoom-overlay').style.display = 'none';
        }

        // アプリ内カメラの起動
        function openCamera() {
            document.getElementById('camera-modal').style.display = 'flex';
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                onScanSuccess
            ).catch(err => {
                alert("カメラの起動に失敗しました。");
                document.getElementById('camera-modal').style.display = 'none';
            });
        }

        function closeCamera() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('camera-modal').style.display = 'none';
                }).catch(() => {
                    document.getElementById('camera-modal').style.display = 'none';
                });
            } else {
                document.getElementById('camera-modal').style.display = 'none';
            }
        }

        // QRコード読み込み成功時
        function onScanSuccess(decodedText) {
            closeCamera();
            const foundCard = cardsData.find(card => decodedText.trim() === card.id);
            
            if (foundCard) {
                if (unlockedCards.includes(foundCard.id)) {
                    alert(`No.${foundCard.no} のカードはすでに持っています！`);
                    return;
                }
                showQuiz(foundCard);
            } else {
                alert("これは有効なトレカのQRコードではありません。");
            }
        }

        // クイズを表示
        function showQuiz(card) {
            currentScanningCard = card;
            document.getElementById('quizMeaning').innerText = card.quiz.meaning;
            document.getElementById('answerInput').value = ''; 
            document.getElementById('quiz-overlay').style.display = 'flex';
            
            setTimeout(() => { document.getElementById('answerInput').focus(); }, 100);
        }

        function closeQuiz() {
            document.getElementById('quiz-overlay').style.display = 'none';
            currentScanningCard = null;
        }

        // 記述式の正誤判定
        function checkAnswer() {
            const userInput = document.getElementById('answerInput').value;
            const card = currentScanningCard;

            const formatString = (str) => str.toLowerCase().trim().replace(/[!.,]/g, '');

            if (formatString(userInput) === formatString(card.quiz.answer)) {
                document.getElementById('quiz-overlay').style.display = 'none';
                alert("正解！カードをゲットしたよ！");
                unlockCard(card);
            } else {
                alert("ちがうよ！もう一度よく考えてみてね。");
                document.getElementById('answerInput').value = '';
                document.getElementById('answerInput').focus();
            }
        }

        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { checkAnswer(); }
        });

        // カード解禁＆アニメーション処理
        function unlockCard(card) {
            unlockedCards.push(card.id);
            localStorage.setItem('unlockedCards', JSON.stringify(unlockedCards));

            const front = document.getElementById('animatedFront');
            front.innerHTML = `
                <img src="${card.img}" loading="lazy">
                <div style="margin-top:20px; font-weight:bold; text-align:center; width:100%;">
                    <div style="font-size:22px; color:#333;">${card.quiz.answer}</div>
                    <div style="font-size:15px; color:#666; margin-top:8px;">No.${card.no} ゲット！</div>
                </div>
            `;

            const overlay = document.getElementById('get-animation-overlay');
            const flipCard = document.getElementById('flipCard');
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                flipCard.classList.add('do-flip');
                confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
            }, 300);
        }

        // アミュニーション画面を閉じる
        function closeAnimation() {
            document.getElementById('get-animation-overlay').style.display = 'none';
            document.getElementById('flipCard').classList.remove('do-flip');
            currentScanningCard = null;
            renderCollection(); 
        }

        // 初期描画
        renderCollection();
    </script>
</body>
</html>
